services:
  pagina:
    build: .
    image: carrerags-pagina:latest
    container_name: carrerags-pagina
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
