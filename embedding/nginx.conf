worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 128;
}

http {
    access_log off;
    server_tokens off;
    client_max_body_size 1m;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 8081;
        server_name _;

        error_page 413 = @body_too_large;
        error_page 502 = @backend_error;
        error_page 504 = @backend_timeout;

        location / {
            set $embedding_backend http://embeddings:8081;
            proxy_pass $embedding_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_connect_timeout 5s;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_next_upstream off;
        }

        location @body_too_large {
            default_type application/json;
            return 413 '{"resultado":false,"mensaje":"Cuerpo mayor que 1 MiB","salida":{}}';
        }
        location @backend_error {
            default_type application/json;
            return 502 '{"resultado":false,"mensaje":"No se pudo contactar el servicio de embeddings","salida":{}}';
        }
        location @backend_timeout {
            default_type application/json;
            return 504 '{"resultado":false,"mensaje":"El servicio de embeddings excedio el tiempo de respuesta","salida":{}}';
        }
    }
}
